name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs, because there are two questions and they have different answers.
#
#   `standalone`  — can a fresh consumer install this from the registry and build
#                   it, with nothing else present? That was ADR-0030 Rule 4's
#                   promise. **Informational since ArchiSimple Sprint 085.0:**
#                   nothing is published any more (ADR-0029 revision 3.0, the
#                   platform is proprietary), so the platform it resolves is
#                   npm's frozen copy of Sprint 31.0, which this repository
#                   outgrew. It still asserts the manifest is registry-only.
#
#   `against-platform-source` — does this still work against the platform being
#                   **developed**? Nobody asked that until Sprint 051.4, and the
#                   cost was concrete: `WallDto` gained two required fields in the
#                   platform's source, `standalone` stayed green because npm still
#                   had the old ten-field version under the same `0.2.0` and the
#                   same `AUTOMATION_CONTRACT_VERSION`, and the mismatch surfaced
#                   days later as a Docker build failure in this repository's test
#                   harness.
#
# The second job does **not** weaken Rule 4. This repository's manifest stays
# registry-only — the "No local dependencies" step below still asserts it — and
# the platform's source is spliced in at install time by a generated pnpm
# workspace, never by a dependency declaration.
jobs:
  standalone:
    runs-on: ubuntu-latest
    # Reports, does not gate (085.0): see the header.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # ADR-0030 Rule 4, asserted rather than trusted: a `workspace:`, `file:`,
      # git or relative dependency would make "standalone" a description of
      # someone's laptop rather than a property of the repository.
      - name: No local dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const all = { ...p.dependencies, ...p.peerDependencies, ...p.devDependencies };
            const bad = Object.entries(all).filter(([, v]) =>
              /^(workspace:|file:|link:|git\+|\.\.?\/)/.test(v));
            if (bad.length) {
              console.error('Local dependencies found:', bad);
              process.exit(1);
            }
            console.log('All ' + Object.keys(all).length + ' dependencies resolve from a registry.');
          "

  # ------------------------------------------------------------------
  # Sprint 051.4. The same splice `Dockerfile.web` and `Dockerfile.ai-service`
  # perform, from the same script, so there is one definition of the combined
  # workspace's shape rather than a third copy here.
  #
  # **The gate since ArchiSimple Sprint 085.0** (ADR-0030 revision 2.0): with
  # nothing published, the platform's source is the only platform there is, so
  # this is the job that tells the truth. It needs PLATFORM_REPO_TOKEN to read
  # the platform repository.
  # ------------------------------------------------------------------
  against-platform-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Architectural Intelligence
        uses: actions/checkout@v4
        with:
          path: architectural-intelligence

      # PLATFORM_REPO_TOKEN must be able to read the archisimple repository if
      # it is private. It is the mirror of the AI_REPO_TOKEN that archisimple's
      # own docker workflow uses to read this one.
      - name: Checkout ArchiSimple
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/archisimple
          path: archisimple
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Splice the two repositories into one workspace
        run: node archisimple/tools/dev-workspace/write-workspace.mjs .

      # No --frozen-lockfile: the workspace is assembled fresh here, so there is
      # no separately-trusted lockfile to freeze against.
      - name: Install
        run: pnpm install

      # Build first: a contract mismatch between the two repositories is a
      # compile-time failure (how the WallDto one surfaced), so it fails here
      # with the clearest message.
      - name: Build against the platform's source
        run: pnpm build

      # And test (085.0). Skipped until then because BUG-011's Test D was red
      # by design; it is `it.fails` now, so a red suite means something.
      - name: Test against the platform's source
        run: pnpm --filter @archisimple/architectural-intelligence test
