    file: src/__tests__/revision-lineage.test.ts
    sprint: 1.3
    covers: 'revise an approved Brief, watch staleness propagate, regenerate each stage in turn, and assert one lineage per stage throughout'
    structuralPortTest: 'a host-shaped object with only all() and current() satisfies PlanningArtefactReader'
    requiresEditor: false
    requiresNetwork: false

