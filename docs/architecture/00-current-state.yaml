    evidence: "DWELLING_WORDS is an exact-match list; Sprint 1.5 added spellings (appartment, appartement) and types (duplex, townhouse, penthouse) but did not widen what counts as evidence — that trade is the classifier's deliberate asymmetry and wants its own decision"
  - id: split-lineage-repair
